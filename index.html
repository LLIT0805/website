<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finde den Fehler im Bild</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        /* Das normale, harmlose Bild */
        #normal-img {
            max-width: 80%;
            max-height: 70vh;
            border: 5px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        /* Das versteckte Jumpscare-Element */
        #jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
        }
        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container" id="content">
        <h1>Finde die 3 Unterschiede im Bild!</h1>
        <p>Schaue ganz genau hin und drehe deine Lautsprecher auf, falls du die Audio-Hinweise brauchst...</p>
        <!-- Ersetze diese URL mit einem harmlosen Bild (z.B. eine Landschaft) -->
        <img id="normal-img" src="https://picsum.photos" alt="Suchbild" onclick="startTimer()">
    </div>

    <!-- Das Jumpscare-Overlay -->
    <div id="jumpscare">
        <!-- Ersetze diese URL mit deinem Gruselbild -->
        <img id="scary-img" src="https://placekitten.com" alt="BOO!">
        <!-- Ersetze diese URL mit deinem Jumpscare-Sound -->
        <audio id="scary-sound" src="https://soundjay.com" preload="auto"></audio>
    </div>

    <script>
        // Startet den Countdown, sobald der Nutzer auf das Bild klickt
        // (Moderne Browser blockieren Sound, bis eine Interaktion stattfindet)
        function startTimer() {
            alert("Suche gestartet! Schau ganz genau hin...");
            
            setTimeout(function() {
                var jumpscareDiv = document.getElementById('jumpscare');
                var sound = document.getElementById('scary-sound');
                
                // Jumpscare anzeigen
                jumpscareDiv.style.display = 'block';
                
                // Sound abspielen
                sound.play().catch(function(error) {
                    console.log("Audio-Autoplay wurde vom Browser blockiert:", error);
                });
            }, 5000); // 5000 Millisekunden = 5 Sekunden Wartezeit
        }
